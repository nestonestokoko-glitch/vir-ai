[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Official Next.js runtime for Netlify — turns the `.next` output into
# Netlify Functions/Edge Functions, handles redirects, and serves the app.
# Netlify installs this plugin automatically at build time.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The clipping pipeline is awaited inside the function on serverless (so the
# job actually completes instead of being frozen after the response). Give it
# generous headroom beyond the default timeout for the real caption fetch.
[functions]
  timeout = 60
